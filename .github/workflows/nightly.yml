name: Nightly

on:
  schedule:
    - cron: "0 6 * * *" # 06:00 UTC daily
  workflow_dispatch:

jobs:
  nightly:
    name: SDK vs BSK develop
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'schedule' && 'develop' || github.ref }}
          submodules: false

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - uses: dtolnay/rust-toolchain@stable

      - name: Install BSK nightly wheel
        run: |
          pip install --pre \
            --index-url https://avslab.github.io/basilisk/nightly/ \
            --extra-index-url https://pypi.org/simple/ \
            --report "$RUNNER_TEMP/bsk-nightly-install.json" \
            "bsk[all]"

      - name: Verify BSK came from the nightly index
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          report = json.loads((Path(os.environ["RUNNER_TEMP"]) / "bsk-nightly-install.json").read_text(encoding="utf-8"))
          urls = [item["download_info"]["url"] for item in report["install"] if item["metadata"]["name"].lower() == "bsk"]
          if len(urls) != 1 or not urls[0].startswith("https://avslab.github.io/basilisk/nightly/bsk/"):
              raise SystemExit(f"Expected BSK from the nightly index; pip selected {urls}")
          PY

      - name: Select source matching the BSK nightly wheel
        run: |
          REF=$(python -c "import Basilisk; info = Basilisk.getBuildInfo()['artifact']; assert info['sourceDirty'] is False; print(info['sourceRevision'], end='')")
          git init external/basilisk
          git -C external/basilisk fetch --depth 1 https://github.com/AVSLab/basilisk.git "$REF"
          git -C external/basilisk checkout --detach FETCH_HEAD

      - name: Sync and build SDK
        run: |
          python tools/sync_all.py --local-rust-dependencies
          pip install build
          python -m build --wheel -o dist
          pip install dist/*.whl

      - name: Run SDK tests
        run: |
          pip install pytest
          pytest tests -v

      - name: Refresh Rust lockfile and license report before packaging
        run: |
          cargo generate-lockfile --manifest-path examples/custom-atm-extension/Cargo.toml
          cargo fetch --manifest-path examples/custom-atm-extension/Cargo.toml --locked
          CARGO_ABOUT_VERSION=$(python -c 'import bsk_sdk; print(bsk_sdk.rust_license_tool_version(), end="")')
          cargo install cargo-about --version "=${CARGO_ABOUT_VERSION}" --locked --features cli
          GENERATOR=$(python -c 'import bsk_sdk; print(bsk_sdk.rust_license_generator(), end="")')
          CONFIG=$(python -c 'import bsk_sdk; print(bsk_sdk.rust_license_config(), end="")')
          python "$GENERATOR" \
            --manifest-path examples/custom-atm-extension/Cargo.toml \
            --config "$CONFIG" \
            --output examples/custom-atm-extension/custom_atm/RUST-THIRD-PARTY.txt \
            --project-name custom-atm-extension --require-tool

      - name: Build and test example extension
        run: |
          pip install scikit-build-core
          python -m build --wheel --no-isolation -o extension-dist \
            -Cbuild-dir=extension-build examples/custom-atm-extension
          pip install extension-dist/*.whl
          python -c "import Basilisk, numba, custom_atm; from custom_atm import numbaAtmosphere, rustAtmosphere"
          pytest examples -v

      - name: Notify on failure
        if: failure()
        run: echo "::warning::Nightly build failed. BSK develop may have introduced a breaking change for bsk-sdk."
