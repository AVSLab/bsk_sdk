name: CI

on:
  pull_request:
  push:
    branches: [master, develop]
  workflow_dispatch:
    inputs:
      bsk_version:
        description: "Override BSK version (e.g. 2.10.2rc1). Defaults to _bsk_version.txt."
        required: false
        default: ""

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (${{ matrix.os }}, ${{ matrix.python_label }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.14"]
        include:
          - python: "3.9"
            python_label: "MIN Python"
          - python: "3.14"
            python_label: "MAX Python"

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}

      - name: Resolve BSK version
        id: bsk
        shell: bash
        run: |
          OVERRIDE="${{ inputs.bsk_version }}"
          if [[ -n "$OVERRIDE" ]]; then
            echo "version=${OVERRIDE}" >> "$GITHUB_OUTPUT"
          else
            echo "version=$(tr -d '[:space:]' < src/bsk_sdk/_bsk_version.txt)" >> "$GITHUB_OUTPUT"
          fi

      - uses: ./.github/actions/setup-bsk
        with:
          version: ${{ steps.bsk.outputs.version }}
          clone-source: "true"
          use-submodule: ${{ inputs.bsk_version == '' && 'true' || 'false' }}
          install-package: "false"

      - name: Report environment
        shell: bash
        run: |
          python --version
          echo "BSK source: $(git -C external/basilisk log -1 --oneline)"

      - name: Sync artifacts
        run: python tools/sync_all.py

      - name: Build wheel
        shell: bash
        run: |
          pip install build
          python -m build --wheel -o dist
        env:
          BSK_SDK_AUTO_SYNC: "0"

      - uses: actions/upload-artifact@v6
        with:
          name: wheel-${{ matrix.os }}-py${{ matrix.python }}
          path: dist/*.whl
          retention-days: 1

  test:
    name: Test wheel (${{ matrix.os }}, ${{ matrix.python_label }})
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.14"]
        include:
          - python: "3.9"
            python_label: "MIN Python"
          - python: "3.14"
            python_label: "MAX Python"

    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: |
            tests
            tools

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}

      - uses: actions/download-artifact@v7
        with:
          name: wheel-${{ matrix.os }}-py${{ matrix.python }}
          path: dist

      - name: Install wheel and test dependencies
        shell: bash
        run: pip install dist/*.whl pytest

      - name: Run SDK tests
        run: pytest tests -v

  examples:
    name: Build example extension (${{ matrix.os }}, ${{ matrix.python_label }})
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.14"]
        include:
          - python: "3.9"
            python_label: "MIN Python"
          - python: "3.14"
            python_label: "MAX Python"

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/download-artifact@v7
        with:
          name: wheel-${{ matrix.os }}-py${{ matrix.python }}
          path: dist

      - name: Install SDK wheel and read BSK version
        id: bsk
        shell: bash
        run: |
          pip install dist/*.whl --force-reinstall
          echo "version=$(python -c "import bsk_sdk; print(bsk_sdk.bsk_version(), end='')")" >> "$GITHUB_OUTPUT"

      - uses: ./.github/actions/setup-bsk
        with:
          version: ${{ steps.bsk.outputs.version }}
          clone-source: "true"
          use-submodule: ${{ inputs.bsk_version == '' && 'true' || 'false' }}
          install-package: "true"

      - name: Align example metadata with the selected BSK checkout
        run: >-
          python tools/sync_all.py
          --basilisk-root external/basilisk
          --no-sync-submodules

      - name: Refresh Rust lockfile for BSK override
        if: ${{ inputs.bsk_version != '' }}
        run: cargo generate-lockfile --manifest-path examples/custom-atm-extension/Cargo.toml

      - name: Report environment
        shell: bash
        run: |
          pip show bsk swig | grep -E "^(Name|Version):"
          python -c "import bsk_sdk; print('bsk-sdk:', bsk_sdk.__version__, '| synced from BSK:', bsk_sdk.bsk_version())"
          rustc --version
          cargo --version

      - name: Build example extension wheel
        # --no-isolation so the build inherits the locally installed bsk-sdk wheel,
        # guaranteeing CI always tests the current branch rather than a stale PyPI version.
        shell: bash
        run: |
          pip install build scikit-build-core
          python -m build --wheel --no-isolation -o extension-dist \
            -Cbuild-dir=extension-build examples/custom-atm-extension

      - uses: actions/upload-artifact@v6
        with:
          name: extension-wheel-${{ matrix.os }}-py${{ matrix.python }}
          path: extension-dist/*.whl
          retention-days: 7

      - name: Install extension wheel and test dependencies
        shell: bash
        run: |
          pip install extension-dist/*.whl pytest
          python -c "import Basilisk, numba, custom_atm; from custom_atm import numbaAtmosphere, rustAtmosphere"

      - name: Run example tests
        run: pytest examples -v

  rust-msrv:
    name: Rust extension (MSRV)
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - uses: actions/download-artifact@v7
        with:
          name: wheel-ubuntu-latest-py3.14
          path: dist

      - name: Install SDK wheel and read BSK version
        id: bsk
        shell: bash
        run: |
          pip install dist/*.whl --force-reinstall
          echo "version=$(python -c "import bsk_sdk; print(bsk_sdk.bsk_version(), end='')")" >> "$GITHUB_OUTPUT"
          echo "rust=$(python -c "import bsk_sdk; print(bsk_sdk.rust_minimum_version(), end='')")" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.bsk.outputs.rust }}
          components: rustfmt, clippy

      - name: Test tagged Rust dependency resolution
        run: |
          python -m pip install pytest
          python -m pytest \
            tests/test_sync_all.py -k tagged_git_dependencies -v

      - uses: ./.github/actions/setup-bsk
        with:
          version: ${{ steps.bsk.outputs.version }}
          clone-source: "true"
          use-submodule: ${{ inputs.bsk_version == '' && 'true' || 'false' }}
          install-package: "true"

      - name: Align example metadata with the selected BSK checkout
        run: >-
          python tools/sync_all.py
          --basilisk-root external/basilisk
          --no-sync-submodules

      - name: Refresh Rust lockfile for BSK override
        if: ${{ inputs.bsk_version != '' }}
        run: cargo generate-lockfile --manifest-path examples/custom-atm-extension/Cargo.toml

      - name: Build Rust extension with the minimum toolchain
        shell: bash
        run: |
          pip install build scikit-build-core
          python -m build --wheel --no-isolation -o extension-dist \
            -Cbuild-dir=extension-build examples/custom-atm-extension

      - name: Configure Rust-native test inputs
        shell: bash
        run: |
          echo "BSK_CMSG_DIRS=$(python -c 'import bsk_sdk; print(bsk_sdk.c_msg_interface_dir())'):${GITHUB_WORKSPACE}/extension-build/autoSource/cMsgCInterface" >> "$GITHUB_ENV"
          echo "BSK_SRC_ROOT=$(python -c 'import bsk_sdk; print(bsk_sdk.include_dir())')/Basilisk" >> "$GITHUB_ENV"
          echo "LIBCLANG_PATH=$(python -c 'import bsk_sdk; print(bsk_sdk.rust_libclang_dir())')" >> "$GITHUB_ENV"

      - name: Check and test the Rust workspace
        working-directory: examples/custom-atm-extension
        run: |
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo test --workspace --locked

      - name: Check Rust dependency licenses
        shell: bash
        run: |
          CARGO_ABOUT_VERSION=$(python -c 'import bsk_sdk; print(bsk_sdk.rust_license_tool_version())')
          cargo install cargo-about --version "=${CARGO_ABOUT_VERSION}" --locked --features cli
          GENERATOR=$(python -c 'import bsk_sdk; print(bsk_sdk.rust_license_generator())')
          CONFIG=$(python -c 'import bsk_sdk; print(bsk_sdk.rust_license_config())')
          python "$GENERATOR" \
            --manifest-path examples/custom-atm-extension/Cargo.toml \
            --config "$CONFIG" \
            --output examples/custom-atm-extension/custom_atm/RUST-THIRD-PARTY.txt \
            --project-name custom-atm-extension --check --require-tool
